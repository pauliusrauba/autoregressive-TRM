[project]
name = "icml-project"
version = "0.1.0"
description = "ICML 2025 - Recursive LLMs / TRM Project"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "wandb>=0.15.0",
    "datasets>=4.4.1",
    "jupyterlab>=4.5.1",
    "notebook>=7.5.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "data_modules", "callbacks"]
